aid: amazon-augmented-ai
name: Amazon Augmented AI
description: >-
  Amazon Augmented AI (Amazon A2I) is a machine learning service that makes it easy to build the workflows required for
  human review of ML predictions. Amazon A2I brings human review to all developers, removing the undifferentiated heavy
  lifting associated with building human review systems or managing large numbers of human reviewers.
